name: IndexNow

# Auto-notify Bing / Yandex / Seznam / Naver whenever the site content changes.
# Runs on every push to main that touches public/ (sitemap, static content),
# and can be triggered manually from the Actions tab.
# No secrets required — the IndexNow key is public by design.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/blog/**'
      - 'src/guides/**'
      - 'scripts/prerender-seo.mjs'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The script reads the live sitemap, so give Vercel time to finish the
      # deploy this push triggered — otherwise a brand-new page is missed.
      - name: Wait for the deploy to land
        run: sleep 150
      - name: Submit sitemap URLs to IndexNow
        run: |
          chmod +x scripts/indexnow.sh
          ./scripts/indexnow.sh
