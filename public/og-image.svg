<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ABCFE"/>
      <stop offset="48%" stop-color="#A259FF"/>
      <stop offset="100%" stop-color="#F24E1E"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A259FF"/>
      <stop offset="50%" stop-color="#FF7262"/>
      <stop offset="100%" stop-color="#F24E1E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow orbs -->
  <circle cx="200" cy="180" r="200" fill="#A259FF" opacity="0.08"/>
  <circle cx="1050" cy="480" r="220" fill="#1ABCFE" opacity="0.07"/>

  <!-- Logo icon -->
  <rect x="510" y="160" width="80" height="80" rx="18" fill="url(#logo)" filter="url(#glow)"/>
  <path d="M527 172h46a3 3 0 0 1 3 3v54l-26-15-26 15v-54a3 3 0 0 1 3-3z"
        fill="none" stroke="white" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- App name -->
  <text x="600" y="308" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="72" font-weight="800" fill="white" letter-spacing="-2">
    Save<tspan fill="url(#text)">Board</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="372" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="400" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">
    Save everything that matters — all in one place
  </text>

  <!-- Feature pills -->
  <rect x="296" y="430" width="150" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="371" y="457" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" fill="rgba(255,255,255,0.75)">Links</text>

  <rect x="466" y="430" width="170" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="551" y="457" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" fill="rgba(255,255,255,0.75)">Articles</text>

  <rect x="656" y="430" width="170" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="741" y="457" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" fill="rgba(255,255,255,0.75)">Videos</text>

  <rect x="846" y="430" width="150" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="921" y="457" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" fill="rgba(255,255,255,0.75)">Notes</text>

  <!-- URL -->
  <text x="600" y="562" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" fill="rgba(255,255,255,0.30)" letter-spacing="1">
    saveboard.app
  </text>
</svg>
