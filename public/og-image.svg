<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ABCFE"/>
      <stop offset="48%" stop-color="#A259FF"/>
      <stop offset="100%" stop-color="#F24E1E"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A259FF"/>
      <stop offset="50%" stop-color="#FF7262"/>
      <stop offset="100%" stop-color="#F24E1E"/>
    </linearGradient>
    <linearGradient id="pill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Subtle top accent bar -->
  <rect width="1200" height="5" fill="url(#logo)"/>

  <!-- Logo icon -->
  <rect x="510" y="148" width="72" height="72" rx="16" fill="url(#logo)"/>
  <path d="M526 161h40a3 3 0 0 1 3 3v47l-23-13-23 13v-47a3 3 0 0 1 3-3z"
        fill="none" stroke="white" stroke-width="3.5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- App name -->
  <text x="600" y="286" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="76" font-weight="800" fill="#111827" letter-spacing="-2">
    Save<tspan fill="url(#brand)">Board</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="346" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" font-weight="400" fill="#6B7280" letter-spacing="0.3">
    Save everything that matters — all in one place
  </text>

  <!-- Divider -->
  <line x1="520" y1="390" x2="680" y2="390" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Feature pills -->
  <rect x="292" y="420" width="130" height="42" rx="21" fill="#F3F4F6"/>
  <text x="357" y="446" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="17" font-weight="500" fill="#374151">Links</text>

  <rect x="440" y="420" width="150" height="42" rx="21" fill="#F3F4F6"/>
  <text x="515" y="446" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="17" font-weight="500" fill="#374151">Articles</text>

  <rect x="608" y="420" width="150" height="42" rx="21" fill="#F3F4F6"/>
  <text x="683" y="446" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="17" font-weight="500" fill="#374151">Videos</text>

  <rect x="776" y="420" width="130" height="42" rx="21" fill="#F3F4F6"/>
  <text x="841" y="446" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="17" font-weight="500" fill="#374151">Notes</text>

  <!-- URL -->
  <text x="600" y="558" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" fill="#9CA3AF" letter-spacing="1">
    saveboard.app
  </text>
</svg>
